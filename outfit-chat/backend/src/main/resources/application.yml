server:
  port: 8080

spring:
  application:
    name: chat-backend
  datasource:
    # 本地默认连 127.0.0.1:3306；Docker 部署时用环境变量覆盖（MYSQL_HOST/MYSQL_PORT/MYSQL_DB/MYSQL_USER/MYSQL_PASSWORD）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:outfit_chat}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: "${MYSQL_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 每次启动执行 schema.sql（建表语句全部 IF NOT EXISTS，可重复执行）
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，排查数据问题方便；上线改回 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# FastAPI AI 服务地址（本地默认 127.0.0.1:8000；Docker 部署时用 AI_BASE_URL=http://ai-service:8000 覆盖）
ai:
  service:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    chat-path: /api/chat/stream
    # 建立连接超时（毫秒）
    connect-timeout-ms: 5000
    # SSE 流最长空闲时间（毫秒）：模型出首个字之前的等待上限
    response-timeout-ms: 120000

logging:
  level:
    com.outfit.chat: debug
