# =====================================================================
# 前端 nginx 配置（容器内）
#   1. 托管 Vue 打包后的静态文件（SPA，history 路由回退 index.html）
#   2. /api 反向代理到 SpringBoot，重点处理 SSE 流式转发
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（SSE 接口单独关 gzip，见下方 location）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---------- SPA 前端 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口（含 SSE）----------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # ↓↓↓ SSE 关键配置：任何一条写错都会导致回答"憋一会儿然后一次性蹦出来" ↓↓↓
        proxy_buffering off;             # 关闭响应缓冲，逐帧下发
        proxy_cache off;                 # 不缓存流
        proxy_read_timeout 3600s;        # 长连接读超时（模型可能想很久）
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;                        # 压缩会导致攒包
        add_header X-Accel-Buffering no; # 双保险：告诉上游/下游不缓冲
    }
}
